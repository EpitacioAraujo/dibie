server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # /pecas era a URL do catálogo e já está solta por aí (links, buscadores)
  location = /pecas {
    return 301 /produtos;
  }

  # páginas pré-renderizadas (/, /produtos/index.html); fallback SPA para o resto
  location / {
    try_files $uri $uri/ $uri/index.html /__spa-fallback.html;
  }

  # assets com hash no nome: cache longo e imutável
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
