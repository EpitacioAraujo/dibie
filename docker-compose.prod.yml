# Override de produção: teto de CPU/memória por serviço (VPS compartilhada).
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ponytail: valores são um teto conservador; ajuste se algum serviço estrangular.
services:
  db:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  backend:
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  front:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  cloudflared:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
