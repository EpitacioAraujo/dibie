services:
  pgsql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dibie
      POSTGRES_USER: dibie
      POSTGRES_PASSWORD: dibie_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dibie"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      pgsql:
        condition: service_healthy
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"

volumes:
  pgdata:
