# Stack completa da dibiê: banco + API (Laravel) + site estático (React/nginx).
# Cada projeto tem seu próprio Dockerfile (./backend, ./front).
services:
  pgsql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dibie
      POSTGRES_USER: dibie
      POSTGRES_PASSWORD: dibie_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dibie"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      pgsql:
        condition: service_healthy
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "${API_PORT:-8000}:8000"

  front:
    build:
      context: ./front
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
