# Stack única: db + API (Laravel) + site (React/nginx) + túnel Cloudflare.
# Dev: `docker compose up` usa os defaults (localhost, volumes nomeados, sem túnel).
# Prod: valores vêm do .env na raiz ops + backend.env/cloudflared.env.
#   CODE_DIR=./code  COMPOSE_PROFILES=prod   (pgdata/ e storage/ são bind mounts)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: backend.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dibie}
      POSTGRES_USER: ${POSTGRES_USER:-dibie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dibie_secret}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dibie}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ${CODE_DIR:-.}/backend
    restart: unless-stopped
    env_file:
      - path: backend.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage/app/public
    ports:
      - "${API_PORT:-8000}:8000"

  front:
    build:
      context: ${CODE_DIR:-.}/front
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_WHATSAPP: ${VITE_WHATSAPP:-5585985242758}
        VITE_INSTAGRAM: ${VITE_INSTAGRAM:-https://www.instagram.com/dibiepersonalizados/}
    restart: unless-stopped
    env_file:
      - path: front.env
        required: false
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"

  # Só sobe em prod (COMPOSE_PROFILES=prod). Token em cloudflared.env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - path: cloudflared.env
        required: false
    profiles: ["prod"]
    depends_on:
      - front
      - backend
