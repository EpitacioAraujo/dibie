<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Nossas peças — dibiê</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body class="page">

        <a class="product reveal" href="#">

      <div class="footer-bottom text-body">

        <a href="mailto:contato@dibie.com.br">contato@dibie.com.br</a>
